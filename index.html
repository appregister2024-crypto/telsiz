<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1216">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Telsiz</title>
<style>
  :root{
    --bg:#0f1216; --panel:#181d23; --line:#262d36; --txt:#e8edf2; --mut:#8b97a4;
    --accent:#f5a524; --ok:#2ecc71; --danger:#ff4d4f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
  }
  .screen{display:none;height:100%;flex-direction:column;max-width:520px;margin:0 auto;padding:20px}
  .screen.active{display:flex}

  /* Giriş */
  #login{justify-content:center;gap:14px}
  #login h1{margin:0 0 4px;font-size:30px;letter-spacing:.5px}
  #login p{margin:0 0 10px;color:var(--mut);font-size:15px}
  label{font-size:13px;color:var(--mut);margin-bottom:-6px}
  input{
    width:100%;padding:15px 14px;font-size:17px;border-radius:12px;
    border:1px solid var(--line);background:var(--panel);color:var(--txt);outline:none;
    -webkit-user-select:text;user-select:text;
  }
  input:focus{border-color:var(--accent)}
  .btn{
    padding:15px;font-size:17px;font-weight:600;border:0;border-radius:12px;
    background:var(--accent);color:#1a1205;cursor:pointer;
  }
  .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line);padding:9px 14px;font-size:14px;font-weight:500}
  #err{color:var(--danger);font-size:14px;min-height:20px}

  /* Oda */
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .room-name{font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub{font-size:13px;color:var(--mut)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:6px}
  .dot.on{background:var(--ok)}
  #now{
    margin:16px 0 8px;padding:12px 14px;border-radius:12px;background:var(--panel);
    text-align:center;font-size:16px;min-height:48px;display:flex;align-items:center;justify-content:center;
  }
  #now.busy{background:#12301f;color:var(--ok)}
  #peers{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-height:22vh;overflow:auto;padding:4px 0}
  .chip{padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px}
  .chip.talk{border-color:var(--ok);color:var(--ok);box-shadow:0 0 0 2px rgba(46,204,113,.2)}
  .chip.me{border-style:dashed}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  #ptt{
    width:min(66vw,280px);aspect-ratio:1;border-radius:50%;border:0;
    background:radial-gradient(circle at 35% 30%,#3a424d,#1d232b);color:var(--txt);
    font-size:22px;font-weight:700;letter-spacing:1px;
    box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 0 0 6px #2a323c;
    touch-action:none;transition:transform .08s, background .12s, box-shadow .12s;
    -webkit-touch-callout:none;
  }
  #ptt.on{
    transform:scale(.96);
    background:radial-gradient(circle at 35% 30%,#ff6b6d,#d62f31);
    box-shadow:0 0 0 10px rgba(255,77,79,.25),0 0 50px rgba(255,77,79,.55), inset 0 0 0 6px #ff9a9b;
  }
  #ptt:disabled{opacity:.4}
  .hint{font-size:13px;color:var(--mut);text-align:center}
</style>
</head>
<body>

<!-- GİRİŞ EKRANI -->
<section id="login" class="screen">
  <h1>📻 Telsiz</h1>
  <p>Adını ve oda adını yaz. Aynı odaya giren herkes seni duyar.</p>
  <label for="name">Adın</label>
  <input id="name" maxlength="20" autocomplete="nickname" placeholder="Örn. Ahmet">
  <label for="room">Oda adı</label>
  <input id="room" maxlength="40" autocapitalize="none" autocomplete="off" placeholder="Örn. ekip-1">
  <div id="err"></div>
  <button id="join" class="btn">Odaya Gir</button>
  <p class="sub" style="text-align:center">Mikrofon izni istenecek. Bilgilerin bu cihazda hatırlanır.</p>
</section>

<!-- ODA EKRANI -->
<section id="roomScreen" class="screen">
  <header>
    <div style="min-width:0">
      <div class="room-name" id="roomTitle">Oda</div>
      <div class="sub"><span class="dot" id="statusDot"></span><span id="status">Bağlanıyor…</span></div>
      <div class="sub" id="dbg" style="font-size:11px"></div>
    </div>
    <button id="leave" class="btn ghost">Çıkış / Oda değiştir</button>
  </header>

  <div id="now">Kanal boş</div>
  <div id="peers"></div>

  <div class="stage">
    <button id="ptt" disabled>BAS KONUŞ</button>
    <div class="hint">Konuşmak için basılı tut, bırakınca dinlersin.<br>(Bilgisayarda: Boşluk tuşu)</div>
  </div>
</section>

<script type="module">
// Sunucusuz WebRTC: Trystero eşleşmeyi herkese açık tracker'lar üzerinden yapar.
// Ses doğrudan cihazlar arasında (peer-to-peer) akar.
import { joinRoom } from 'https://esm.run/trystero@0.21/torrent';

// Kendi projen için bu değeri benzersiz bir şeyle değiştir (farklı uygulamalarla karışmasın).
const APP_ID = 'telsiz-walkie-talkie-7c41e9';
const LS_KEY = 'telsiz.session.v1';

// Farklı ağlardaki (ör. mobil veri + Wi-Fi) telefonların bağlanabilmesi için TURN röle sunucusu gerekir.
// Aşağıdaki herkese açık sunucular ücretsiz ama yoğun/kararsız olabilir.
// Güvenilir kullanım için metered.ca veya Cloudflare'den ücretsiz kendi TURN anahtarını alıp buraya yaz.
const ICE_SERVERS = [
  { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:global.stun.twilio.com:3478'] },
  { urls: 'turn:openrelay.metered.ca:80',                 username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443',                username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp',  username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turns:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
];

const $ = id => document.getElementById(id);
const screens = { login: $('login'), room: $('roomScreen') };
function show(name){
  Object.entries(screens).forEach(([k,el]) => el.classList.toggle('active', k===name));
}

let session = null;          // {name, room}
let room = null;
let micStream = null;
let sendTalk = null;
let talking = false;
let wakeLock = null;
const peers = new Map();     // peerId -> {name, talking, audio}
const pendingAudio = new Set();

/* ---------- Saklama ---------- */
function loadSession(){
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || null; } catch { return null; }
}
function saveSession(s){
  try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch {}
}

/* ---------- Bip sesleri ---------- */
let actx = null;
function beep(freq=880, dur=0.09, vol=0.12){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }catch{}
}
const vibrate = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch{} };

/* ---------- Ekran açık kalsın ---------- */
async function keepAwake(){
  try{ if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch{}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && room) keepAwake();
  else stopTalk();
});

/* ---------- Arayüz ---------- */
function setStatus(text, on=false){
  $('status').textContent = text;
  $('statusDot').classList.toggle('on', on);
}
function chip(text, cls=''){
  const d = document.createElement('div');
  d.className = 'chip ' + cls;
  d.textContent = text;
  return d;
}
function render(){
  const list = $('peers');
  list.innerHTML = '';
  list.appendChild(chip((session?.name || 'Ben') + ' (sen)', 'me' + (talking ? ' talk' : '')));
  peers.forEach(p => list.appendChild(chip(p.name || '…', p.talking ? 'talk' : '')));

  const speakers = [...peers.values()].filter(p => p.talking).map(p => p.name || '…');
  const now = $('now');
  if (talking) { now.textContent = '🔴 Konuşuyorsun'; now.classList.remove('busy'); }
  else if (speakers.length) { now.textContent = '🔊 ' + speakers.join(', ') + ' konuşuyor…'; now.classList.add('busy'); }
  else { now.textContent = 'Kanal boş'; now.classList.remove('busy'); }

  setStatus(peers.size ? `${peers.size + 1} kişi odada` : 'Odada yalnızsın', true);
}

/* ---------- Odaya giriş ---------- */
async function enter(name, roomName){
  session = { name, room: roomName };
  $('roomTitle').textContent = '#' + roomName;
  setStatus('Mikrofon açılıyor…');
  show('room');

  try{
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true }
    });
  }catch(e){
    session = null;
    show('login');
    $('err').textContent = 'Mikrofon izni verilmedi. Tarayıcı ayarlarından mikrofona izin ver.';
    return;
  }
  // Bas-konuş: parça normalde kapalı, basınca açılır.
  micStream.getAudioTracks().forEach(t => t.enabled = false);

  saveSession(session);           // bir kez girince hatırla
  keepAwake();
  setStatus('Bağlanıyor…');

  room = joinRoom({ appId: APP_ID, rtcConfig: { iceServers: ICE_SERVERS } }, roomName);
  const [sendHello, getHello] = room.makeAction('hello');
  const [sendTalkFn, getTalk] = room.makeAction('talk');
  sendTalk = sendTalkFn;

  const ensure = id => {
    if (!peers.has(id)) peers.set(id, { name: '', talking: false, audio: null });
    return peers.get(id);
  };

  room.onPeerJoin(id => {
    ensure(id);
    room.addStream(micStream, id);        // sesimi yeni gelene aç
    sendHello({ name }, id);              // adımı söyle
    render();
  });

  room.onPeerLeave(id => {
    const p = peers.get(id);
    if (p?.audio){ pendingAudio.delete(p.audio); p.audio.srcObject = null; p.audio.remove(); }
    peers.delete(id);
    render();
  });

  room.onPeerStream((stream, id) => {
    const p = ensure(id);
    if (p.audio){ p.audio.srcObject = null; p.audio.remove(); }
    const a = document.createElement('audio');
    a.autoplay = true; a.playsInline = true; a.srcObject = stream;
    a.style.display = 'none';
    document.body.appendChild(a);
    p.audio = a;
    a.play().catch(() => pendingAudio.add(a));   // otomatik oynatma engellenirse ilk dokunuşta açılır
  });

  getHello((data, id) => {
    const p = ensure(id);
    p.name = String(data?.name || '').slice(0, 20) || 'Bilinmeyen';
    render();
  });

  getTalk((data, id) => {
    const p = ensure(id);
    p.talking = !!data;
    render();
  });

  $('ptt').disabled = false;
  render();
}

/* ---------- Tanı (bağlantı durumu) ---------- */
setInterval(() => {
  const el = $('dbg');
  if (!room) { el.textContent = ''; return; }
  try{
    const conns = room.getPeers();
    const ids = Object.keys(conns);
    if (!ids.length) { el.textContent = 'Eşleşme aranıyor…'; return; }
    const parts = ids.map(id => {
      const pc = conns[id];
      const heard = peers.get(id)?.audio ? 'ses✓' : 'ses✗';
      return `${peers.get(id)?.name || '?'}: ${pc.iceConnectionState}, ${heard}`;
    });
    el.textContent = parts.join(' | ');
  }catch{ el.textContent = ''; }
}, 1500);

/* ---------- Çıkış ---------- */
function leave(){
  stopTalk();
  try{ room && room.leave(); }catch{}
  room = null; sendTalk = null;
  peers.forEach(p => { if (p.audio){ p.audio.srcObject = null; p.audio.remove(); } });
  peers.clear(); pendingAudio.clear();
  if (micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  try{ wakeLock && wakeLock.release(); }catch{}
  wakeLock = null;

  // Oda bilgisini unut, adı koru → başka odaya geçilebilsin
  const name = session?.name || '';
  session = null;
  try{ localStorage.removeItem(LS_KEY); }catch{}
  $('name').value = name;
  $('room').value = '';
  $('err').textContent = '';
  $('ptt').disabled = true;
  show('login');
  $('room').focus();
}

/* ---------- Bas-konuş ---------- */
function startTalk(){
  if (talking || !room || !micStream) return;
  talking = true;
  micStream.getAudioTracks().forEach(t => t.enabled = true);
  $('ptt').classList.add('on');
  $('ptt').textContent = 'KONUŞ…';
  beep(1000, 0.07); vibrate(25);
  sendTalk && sendTalk(true);
  render();
}
function stopTalk(){
  if (!talking) return;
  talking = false;
  micStream && micStream.getAudioTracks().forEach(t => t.enabled = false);
  $('ptt').classList.remove('on');
  $('ptt').textContent = 'BAS KONUŞ';
  beep(620, 0.09); vibrate(15);       // "roger" bip
  sendTalk && sendTalk(false);
  render();
}

const ptt = $('ptt');
ptt.addEventListener('pointerdown', e => {
  e.preventDefault();
  try{ ptt.setPointerCapture(e.pointerId); }catch{}
  startTalk();
});
['pointerup','pointercancel','lostpointercapture'].forEach(ev =>
  ptt.addEventListener(ev, e => { e.preventDefault(); stopTalk(); })
);
ptt.addEventListener('contextmenu', e => e.preventDefault());

// Bilgisayar için: boşluk tuşu
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && screens.room.classList.contains('active') && !e.repeat){
    e.preventDefault(); startTalk();
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') { e.preventDefault(); stopTalk(); }
});
window.addEventListener('blur', stopTalk);

// Engellenen sesleri ilk dokunuşta başlat
document.addEventListener('pointerdown', () => {
  if (actx && actx.state === 'suspended') actx.resume();
  pendingAudio.forEach(a => a.play().then(() => pendingAudio.delete(a)).catch(() => {}));
}, { passive: true });

/* ---------- Form ---------- */
function normRoom(r){ return r.trim().toLowerCase().replace(/\s+/g, '-'); }

$('join').addEventListener('click', () => {
  const name = $('name').value.trim();
  const roomName = normRoom($('room').value);
  if (!name || !roomName){ $('err').textContent = 'Ad ve oda adı gerekli.'; return; }
  $('err').textContent = '';
  beep(0.0001, 0.01, 0.0001);   // ses motorunu kullanıcı dokunuşuyla uyandır
  enter(name, roomName);
});
['name','room'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') $('join').click(); }));
$('leave').addEventListener('click', leave);

/* ---------- Açılış: kayıtlı bilgi varsa direkt gir ---------- */
const saved = loadSession();
if (saved?.name && saved?.room){
  $('name').value = saved.name;
  $('room').value = saved.room;
  enter(saved.name, saved.room);
} else {
  show('login');
}
</script>
</body>
</html>
